name: Validation
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    strategy:
      fail-fast: false
      matrix:
        features: ['', '--no-default-features']
    env:
      CARGO_TARGET_DIR: /var/tmp/o3-build/ci
      TMPDIR: /var/tmp/o3-build/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime dependencies inside the disposable container
        timeout-minutes: 5
        run: |
          missing=0
          for executable in ffmpeg python3 git ssh ps node curl; do
            command -v "$executable" >/dev/null 2>&1 || missing=1
          done
          if [ "$missing" = 0 ]; then
            exit 0
          fi
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y --no-install-recommends ffmpeg python3 git openssh-client procps nodejs curl
      - name: Verify container isolation before executing tests
        run: test -f /.dockerenv
      - name: Verify the checked-out repository from the job container
        run: git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree
      - run: mkdir -p "$TMPDIR"
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - name: Enforce test filesystem policy before runtime execution
        run: python3 tools/check-test-safety --full
      - run: cargo test --locked -j 4 ${{ matrix.features }}
      - run: cargo clippy --locked --all-targets -j 4 ${{ matrix.features }} -- -D warnings
      - run: python3 tools/gen-compat && git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- docs/COMPATIBILITY.md
      - run: python3 tools/test-nightly-watch.py
