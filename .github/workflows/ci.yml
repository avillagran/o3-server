name: Validation
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['', '--no-default-features']
    env:
      CARGO_TARGET_DIR: /var/tmp/o3-build/ci
      TMPDIR: /var/tmp/o3-build/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Install video decoder required by device stream regression
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y --no-install-recommends ffmpeg
      - run: mkdir -p "$TMPDIR"
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo test --locked -j 4 ${{ matrix.features }}
      - run: cargo clippy --locked --all-targets -j 4 ${{ matrix.features }} -- -D warnings
      - run: python3 tools/gen-compat && git diff --exit-code -- docs/COMPATIBILITY.md
      - run: python3 tools/test-nightly-watch.py
