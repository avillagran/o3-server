name: Release
# Pushing a tag vX.Y.Z (equal to Cargo.toml's version) builds the Linux binaries
# and publishes them with SHA256SUMS. Installers pin a version and its hashes.
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: /var/tmp/o3-build/release
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "o3-server") | .version')
          [[ "$TAG" == "v$version" ]] || { echo "tag $TAG does not match version $version" >&2; exit 1; }
      - run: cargo build --release --locked -j 4
      - name: Check the binary
        run: |
          bin=$CARGO_TARGET_DIR/release/o3-server
          [[ $(uname -m) == "$ARCH" ]]
          [[ $("$bin" --version) == "o3-server ${TAG#v}" ]]
          # Omarchy devices need glibc 2.39 or newer, like OmaBridge; never require more.
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          printf '%s\n' "requires $newest"
          [[ $(printf '%s\n' "$newest" GLIBC_2.39 | sort -V | tail -1) == GLIBC_2.39 ]]
      - name: Package
        run: |
          name="o3-server-$TAG-$ARCH-linux"
          mkdir -p "dist/$name"
          install -m755 "$CARGO_TARGET_DIR/release/o3-server" "dist/$name/o3-server"
          cp LICENSE docs/THIRD-PARTY-NOTICES.md "dist/$name/"
          tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: o3-server-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        run: |
          cd dist
          sha256sum o3-server-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "o3-server $TAG" \
            --notes "Linux binaries (x86_64, aarch64; glibc 2.39 or newer). Verify with SHA256SUMS." \
            o3-server-*.tar.gz SHA256SUMS
