[package]
name = "o3-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lean Rust server, wire-compatible with T3 Code clients, with OmaBridge built in"

[features]
memory-diagnostics = []
default = ["bridge"]
bridge = ["dep:omabridge", "dep:anyhow", "dep:t3-protocol"]

[dependencies]
t3-protocol = { git = "https://github.com/avillagran/lib-t3-rust", rev = "8c80c4dc62414c454eaefb4706d973adf8d8ee74", optional = true }
omabridge = { version = "0.2.4", default-features = false, features = ["embed"], optional = true }
anyhow = { version = "1", optional = true }
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "process", "fs"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2"
base64 = "0.22"
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
t3-protocol = { git = "https://github.com/avillagran/lib-t3-rust", rev = "8c80c4dc62414c454eaefb4706d973adf8d8ee74" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Local co-development only: replace with a pinned upstream git rev before release.
[patch.crates-io]
omabridge = { path = "../omabridge-embed" }

[profile.dev]
debug = 0
incremental = false

[[example]]
name = "bridge_probe"
required-features = ["bridge"]
