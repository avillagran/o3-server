[package]
name = "o3-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lean Rust server, wire-compatible with T3 Code clients, with OmaBridge built in"

[features]
memory-diagnostics = []
# Diagnostic builds only: counts SQL statements per text and logs the top ones every 60 s.
sql-profile = ["rusqlite/trace"]
default = ["bridge"]
bridge = ["dep:omabridge", "dep:anyhow", "dep:t3-protocol"]

[dependencies]
ignore = "0.4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
t3-protocol = { git = "https://github.com/avillagran/lib-t3-rust?o3-reader-pin", rev = "7cbad5d8198d37e9ded767d33ac03f2cf15875f4", optional = true }
omabridge = { git = "https://github.com/avillagran/omabridge", rev = "0fc1610ec6c96a76a293108f6b8c6737266c7ebc", default-features = false, features = ["embed"], optional = true }
anyhow = { version = "1", optional = true }
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "process", "fs"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
quick-xml = { version = "0.42", features = ["escape-html"] }
encoding_rs = "0.8.35"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
indexmap = { version = "2.14.2", features = ["serde"] }
ryu-js = "1.0.3"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
t3-protocol = { git = "https://github.com/avillagran/lib-t3-rust?o3-reader-pin", rev = "7cbad5d8198d37e9ded767d33ac03f2cf15875f4" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = false

[[example]]
name = "bridge_probe"
required-features = ["bridge"]

# OmaBridge also links the protocol's exported FFI symbols: use one revision.
[patch."https://github.com/avillagran/lib-t3-rust"]
t3-protocol = { path = "compat/t3-protocol" }
